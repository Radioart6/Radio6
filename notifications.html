<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatures - RADIO 6</title>
    <link rel="stylesheet" href="style (6).css">
    <style>
        /* Petits ajouts esthétiques fluides */
        .admin-card {
            animation: fadeIn 0.4s ease-in-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-radius: 12px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #btn-suivant:hover {
            transform: scale(1.1);
            background: var(--accent) !important;
        }
        .info-ligne {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="logo (1).png" alt="Logo Radio 6" class="header-logo">
            <div>
                <span class="site-title"><strong>RADIO 6</strong></span><br>
                <span class="site-subtitle" style="font-size: 0.75rem;">Lycée Arcisse de Caumont</span>
            </div>
        </div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="equipe.html">L'Équipe</a>
            <a href="aide.html">Aide</a>
            <a href="calendrier.html">Calendrier</a>
            <a href="instagram.html">Instagram</a>
        </nav>
    </header>

    <main style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
        <section class="admin-card" style="width: 100%; max-width: 580px; position: relative; min-height: 300px; padding: 2.5rem;">
            <h3 style="display: flex; align-items: center; gap: 10px;">📥 Boîte de réception - Candidatures</h3>
            
            <div id="contenu-candidat" style="margin-top: 1.5rem; line-height: 1.8;">
                <p id="aucun-msg" style="color: var(--text-muted); text-align: center; padding: 3rem 0; font-style: italic;">Aucune candidature pour le moment.</p>
                
                <div id="infos-box" class="hidden">
                    <div class="info-ligne"><p style="font-size: 1.05rem;"><strong>👤 Prénom & Nom :</strong> <span id="val-nom"></span></p></div>
                    <div class="info-ligne"><p style="font-size: 1.05rem;"><strong>🏫 Classe :</strong> <span id="val-classe"></span></p></div>
                    <div class="info-ligne"><p style="font-size: 1.05rem;"><strong>🎧 Pôle souhaité :</strong> <span id="val-role" style="color: var(--accent); font-weight: bold;"></span></p></div>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 1.5rem; text-align: right;">Reçu le : <span id="val-date"></span></p>
                </div>
            </div>

            <!-- Flèche élégante en bas à droite -->
            <button id="btn-suivant" class="hidden" title="Candidat suivant" style="position: absolute; bottom: 20px; right: 20px; background: var(--primary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: all 0.2s;">
                ➔
            </button>
            
            <div id="compteur-index" style="position: absolute; bottom: 32px; left: 30px; font-size: 0.85rem; color: var(--text-muted); font-weight: 500;"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Radio 6 - Espace de rediffusion du Lycée Arcisse de Caumont, Bayeux</p>
    </footer>

    <script>
        let listeCandidats = JSON.parse(localStorage.getItem('candidatures_radio')) || [];
        let currentIndex = 0;

        function afficherCandidat(index) {
            if (listeCandidats.length === 0) {
                document.getElementById('aucun-msg').style.display = 'block';
                document.getElementById('infos-box').classList.add('hidden');
                document.getElementById('btn-suivant').classList.add('hidden');
                return;
            }

            document.getElementById('aucun-msg').style.display = 'none';
            document.getElementById('infos-box').classList.remove('hidden');
            document.getElementById('btn-suivant').classList.remove('hidden');

            let c = listeCandidats[index];
            document.getElementById('val-nom').innerText = c.prenom + " " + c.nom;
            document.getElementById('val-classe').innerText = c.classe;
            document.getElementById('val-role').innerText = c.role;
            document.getElementById('val-date').innerText = c.date;

            document.getElementById('compteur-index').innerText = `Candidat ${index + 1} / ${listeCandidats.length}`;
        }

        document.getElementById('btn-suivant').addEventListener('click', function() {
            currentIndex++;
            if (currentIndex >= listeCandidats.length) {
                currentIndex = 0; 
            }
            afficherCandidat(currentIndex);
        });

        afficherCandidat(currentIndex);
    </script>
</body>
</html>
