<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">
    <title>Candidatures - RADIO 6</title>
    <!-- SDK Supabase (indispensable) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f1020;
            --card-bg: #1a1c38;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --primary: #6366f1;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(15, 16, 32, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 50%;
        }

        .site-title {
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .site-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--accent);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .admin-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 650px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            min-height: 320px;
            animation: fadeIn 0.4s ease-in-out;
            padding-bottom: 5rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.8rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .card-header-top h3 {
            margin: 0;
            font-size: 1.3rem;
        }

        /* Bouton grille stylisé en haut à droite */
        #btn-grille {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        #btn-grille:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .info-ligne {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid var(--accent);
        }

        .info-ligne p {
            margin: 0;
            font-size: 1.05rem;
        }

        /* Vue Grille */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 260px;
            overflow-y: auto;
        }

        .grid-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .grid-item:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .grid-item h4 {
            margin: 0 0 5px 0;
            font-size: 0.95rem;
            color: var(--accent);
        }

        .grid-item p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .action-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-action {
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
            color: white;
        }

        #btn-supprimer { background: var(--danger); }
        #btn-supprimer:hover { transform: scale(1.1); background: #dc2626; }

        #btn-precedent { background: rgba(255, 255, 255, 0.15); }
        #btn-precedent:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.3); }

        #btn-suivant { background: var(--primary); }
        #btn-suivant:hover { transform: scale(1.1); background: var(--accent); }

        #compteur-index {
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="logo.png" alt="Logo Radio 6" class="header-logo">
            <div>
                <span class="site-title"><strong>RADIO 6</strong></span><br>
                <span class="site-subtitle">Lycée Arcisse de Caumont</span>
            </div>
        </div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="equipe.html">L'Équipe</a>
            <a href="aide.html">Aide</a>
            <a href="calendrier.html">Calendrier</a>
            <a href="instagram.html">Instagram</a>
        </nav>
    </header>

    <main>
        <section class="admin-card">
            <div class="card-header-top">
                <h3>📥 Boîte de réception - Candidatures</h3>
                <button id="btn-grille" title="Vue grille / Vue normale">田</button>
            </div>
            
            <div id="contenu-candidat" style="margin-top: 1rem;">
                <p id="aucun-msg" style="color: var(--text-muted); text-align: center; padding: 3rem 0; font-style: italic;">Chargement des candidatures...</p>
                
                <!-- Vue Unique (Flèches) -->
                <div id="infos-box" class="hidden">
                    <div class="info-ligne"><p><strong>👤 Prénom & Nom :</strong> <span id="val-nom"></span></p></div>
                    <div class="info-ligne"><p><strong>🏫 Classe :</strong> <span id="val-classe"></span></p></div>
                    <div class="info-ligne"><p><strong>🎧 Pôle souhaité :</strong> <span id="val-role" style="color: var(--accent); font-weight: bold;"></span></p></div>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 1.5rem; text-align: right;">Reçu le : <span id="val-date"></span></p>
                </div>

                <!-- Vue Grille -->
                <div id="grid-box" class="grid-container hidden"></div>
            </div>

            <div id="bloc-actions" class="action-buttons hidden">
                <button id="btn-supprimer" class="btn-action" title="Supprimer cette candidature">🗑️</button>
                <button id="btn-precedent" class="btn-action" title="Candidat précédent">⬅️</button>
                <button id="btn-suivant" class="btn-action" title="Candidat suivant">➔</button>
            </div>
            <div id="compteur-index"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Radio 6 - Espace de rediffusion du Lycée Arcisse de Caumont, Bayeux</p>
    </footer>

    <script>
        // 1. Configuration de Supabase
        const SUPABASE_URL = "https://cbaiwrlsuqyxhosnigkf.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNiYWl3cmxzdXF5eGhvc25pZ2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDkxNjIsImV4cCI6MjA5NjEyNTE2Mn0.u-mA4YEDwiZQ5qkGc9vDssUh_wDRUYrXtEO9be5gYfg";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let listeCandidats = [];
        let currentIndex = 0;
        let modeGrille = false;

        // 2. Charger les candidatures depuis Supabase
        async function chargerCandidatures() {
            const aucunMsg = document.getElementById('aucun-msg');
            aucunMsg.innerText = "Chargement des candidatures...";
            aucunMsg.style.display = 'block';

            const { data, error } = await supabase
                .from('candidatures')
                .select('*')
                .order('created_at', { ascending: false }); // Classement du plus récent au plus ancien

            if (error) {
                console.error("Erreur lors de la récupération des données :", error);
                aucunMsg.innerText = "Erreur lors du chargement des candidatures.";
                return;
            }

            // Formater les dates pour chaque candidature
            listeCandidats = (data || []).map(c => ({
                ...c,
                dateFormatee: c.created_at 
                    ? new Date(c.created_at).toLocaleDateString('fr-FR', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                      })
                    : 'Date inconnue'
            }));

            mettreAJourAffichage();
        }

        // 3. Supprimer une candidature dans Supabase
        async function supprimerCandidatureActuelle() {
            if (listeCandidats.length === 0) return;

            const candidat = listeCandidats[currentIndex];
            if (!candidat || !candidat.id) return;

            if (confirm(`Voulez-vous vraiment supprimer la candidature de ${candidat.prenom} ${candidat.nom} ?`)) {
                const { error } = await supabase
                    .from('candidatures')
                    .delete()
                    .eq('id', candidat.id);

                if (error) {
                    alert("Erreur lors de la suppression : " + error.message);
                } else {
                    // Recharger la liste depuis Supabase
                    await chargerCandidatures();
                    if (currentIndex >= listeCandidats.length && currentIndex > 0) {
                        currentIndex = listeCandidats.length - 1;
                    }
                }
            }
        }

        // 4. Mettre à jour l'affichage dynamique
        function mettreAJourAffichage() {
            const aucunMsg = document.getElementById('aucun-msg');

            if (listeCandidats.length === 0) {
                aucunMsg.innerText = "Aucune candidature pour le moment.";
                aucunMsg.style.display = 'block';
                document.getElementById('infos-box').classList.add('hidden');
                document.getElementById('grid-box').classList.add('hidden');
                document.getElementById('bloc-actions').classList.add('hidden');
                document.getElementById('btn-grille').classList.add('hidden');
                document.getElementById('compteur-index').innerText = "";
                return;
            }

            aucunMsg.style.display = 'none';
            document.getElementById('btn-grille').classList.remove('hidden');
            document.getElementById('bloc-actions').classList.remove('hidden');

            if (modeGrille) {
                // --- MODE GRILLE ---
                document.getElementById('infos-box').classList.add('hidden');
                document.getElementById('grid-box').classList.remove('hidden');
                document.getElementById('btn-precedent').classList.add('hidden');
                document.getElementById('btn-suivant').classList.add('hidden');
                document.getElementById('btn-supprimer').classList.add('hidden');

                let gridHtml = '';
                listeCandidats.forEach((c, idx) => {
                    gridHtml += `
                        <div class="grid-item" onclick="selectionnerDepuisGrille(${idx})">
                            <h4>${echapperHTML(c.prenom)} ${echapperHTML(c.nom)}</h4>
                            <p>${echapperHTML(c.classe)} - ${echapperHTML(c.role)}</p>
                        </div>
                    `;
                });
                document.getElementById('grid-box').innerHTML = gridHtml;
                document.getElementById('compteur-index').innerText = `${listeCandidats.length} candidature(s)`;

            } else {
                // --- MODE FICHE UNIQUE ---
                document.getElementById('grid-box').classList.add('hidden');
                document.getElementById('infos-box').classList.remove('hidden');
                document.getElementById('btn-precedent').classList.remove('hidden');
                document.getElementById('btn-suivant').classList.remove('hidden');
                document.getElementById('btn-supprimer').classList.remove('hidden');

                if (currentIndex >= listeCandidats.length) {
                    currentIndex = listeCandidats.length - 1;
                }
                if (currentIndex < 0) {
                    currentIndex = 0;
                }

                let c = listeCandidats[currentIndex];
                document.getElementById('val-nom').innerText = (c.prenom || '') + " " + (c.nom || '');
                document.getElementById('val-classe').innerText = c.classe || '';
                document.getElementById('val-role').innerText = c.role || '';
                document.getElementById('val-date').innerText = c.dateFormatee || '';

                document.getElementById('compteur-index').innerText = `Candidat ${currentIndex + 1} / ${listeCandidats.length}`;
            }
        }

        // Sécurité contre l'injection HTML dans la grille
        function echapperHTML(texte) {
            if (!texte) return '';
            return String(texte)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // --- ÉVÉNEMENTS BOUTONS ---

        // Basculer vue Grille / Vue Fiche
        document.getElementById('btn-grille').addEventListener('click', function() {
            modeGrille = !modeGrille;
            mettreAJourAffichage();
        });

        // Sélectionner depuis la vue grille
        window.selectionnerDepuisGrille = function(index) {
            currentIndex = index;
            modeGrille = false;
            mettreAJourAffichage();
        };

        // Bouton Suivant ➔
        document.getElementById('btn-suivant').addEventListener('click', function() {
            currentIndex++;
            if (currentIndex >= listeCandidats.length) {
                currentIndex = 0; 
            }
            mettreAJourAffichage();
        });

        // Bouton Précédent ⬅️
        document.getElementById('btn-precedent').addEventListener('click', function() {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = listeCandidats.length - 1; 
            }
            mettreAJourAffichage();
        });

        // Bouton Supprimer 🗑️
        document.getElementById('btn-supprimer').addEventListener('click', supprimerCandidatureActuelle);

        // Lancement au chargement de la page
        chargerCandidatures();
    </script>
</body>
</html>
