<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat & Messages - Radio 6</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-container {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 800px;
            margin: 2rem auto;
        }

        .chat-messages {
            height: 380px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-delete-msg {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .btn-delete-msg:hover {
            opacity: 1;
        }

        .user-info-inputs {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .user-info-inputs input {
            flex: 1;
            min-width: 110px;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3);
            color: var(--text);
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="season-mode">

    <header>
        <div class="logo-area">
            <img src="LogoArt6automne.png" alt="Radio 6" class="header-logo">
            <div>
                <strong class="site-title">RADIO 6</strong><br>
                <small class="site-subtitle">Lycée Arcisse de Caumont</small>
            </div>
        </div>
        
        <nav id="main-nav">
            <button id="burger-menu-btn" class="burger-btn" title="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div id="nav-links" class="nav-links-container">
                <button id="btn-login-open" class="btn-nav-login">Connexion</button>
                <a href="index.html">Accueil</a>
                <a href="equipe.html">L'Équipe</a>
                <a href="rejoindre.html">Rejoindre l'équipe</a>
                <a href="aide.html">Aide</a>
                <a href="calendrier.html">🗓️ Calendrier</a>
                <a href="messages.html" class="active">Chat d'émission</a>
                <a href="instagram.html">Instagram</a>
                
                <a href="notifications.html" id="lien-cloche" class="hidden" style="position: relative; text-decoration: none; display: inline-flex; align-items: center;" title="Voir les candidatures">
                    🔔 <span id="badge-notif" style="display: none; background: #ef4444; color: white; font-size: 0.65rem; padding: 1px 5px; border-radius: 50%; position: absolute; top: -6px; right: -8px; font-weight: bold;">0</span>
                </a>

                <button id="param-btn" class="btn-nav-param" title="Paramètres"><i class="fa-solid fa-gear"></i></button>
            </div>
        </nav>
    </header>

    <main>
        <!-- CONTENU DU CHAT PUBLIC -->
        <div class="chat-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="margin: 0; font-size: 1.4rem;"><i class="fa-solid fa-comments" style="color: var(--accent);"></i> Salon de Discussion en Direct</h2>
                <span id="chat-status-badge" style="background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;">
                    🟢 Mode Test Ouvert
                </span>
            </div>

            <div id="chat-box" class="chat-messages">
                <div id="chat-welcome" style="text-align: center; color: var(--text-muted); margin-top: 3rem;">
                    <i class="fa-solid fa-comments" style="font-size: 2.2rem; margin-bottom: 0.8rem; color: var(--accent);"></i>
                    <p style="margin: 0;">Bienvenue ! Le chat est actuellement ouvert pour les tests.</p>
                </div>
            </div>

            <form id="chat-form">
                <div id="identity-box" class="user-info-inputs">
                    <input type="text" id="user-prenom" placeholder="Prénom *" required>
                    <input type="text" id="user-nom" placeholder="Nom *" required>
                    <input type="text" id="user-classe" placeholder="Classe (ex: 2nde C) *" required>
                </div>

                <div style="display: flex; gap: 10px;">
                    <input type="text" id="chat-input" placeholder="Écrivez votre message..." style="flex: 1; padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: var(--bg-color); color: var(--text);" required>
                    <button type="submit" class="btn-admin-action" style="padding: 0 1.5rem; align-self: stretch;">Envoyer</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; Radio 6 - La Radio d'Art 6</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAdmin = sessionStorage.getItem('adminMode') === 'true';

            if (isAdmin) {
                const idBox = document.getElementById('identity-box');
                if (idBox) idBox.style.display = 'none';
            } else {
                document.getElementById('user-prenom').value = localStorage.getItem('chat_prenom') || '';
                document.getElementById('user-nom').value = localStorage.getItem('chat_nom') || '';
                document.getElementById('user-classe').value = localStorage.getItem('chat_classe') || '';
            }

            if (typeof db !== 'undefined') {
                const chatBox = document.getElementById('chat-box');
                const chatForm = document.getElementById('chat-form');
                const chatInput = document.getElementById('chat-input');

                function renderMessage(msg) {
                    const welcomeMsg = document.getElementById('chat-welcome');
                    if (welcomeMsg) welcomeMsg.remove();

                    let existingDiv = document.getElementById(`msg-${msg.id}`);

                    if (!existingDiv) {
                        existingDiv = document.createElement('div');
                        existingDiv.id = `msg-${msg.id}`;
                        existingDiv.style.cssText = 'margin-bottom: 0.8rem; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); position: relative;';
                        chatBox.appendChild(existingDiv);
                    }

                    const dateObj = new Date(msg.created_at);
                    const time = isNaN(dateObj) ? 'À l\'instant' : dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    if (msg.is_deleted) {
                        existingDiv.innerHTML = `
                            <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                                <strong style="color: var(--text-muted); font-size: 0.85rem;">${msg.pseudo}</strong>
                                <small style="color: var(--text-muted); font-size: 0.75rem;">${time}</small>
                            </div>
                            <p style="margin: 0; color: #ef4444; font-style: italic; font-size: 0.85rem;">
                                <i class="fa-solid fa-ban"></i> Ce message a été supprimé par l'admin.
                            </p>
                        `;
                    } else {
                        let deleteBtnHTML = '';
                        if (isAdmin) {
                            deleteBtnHTML = `<button class="btn-delete-msg" onclick="deleteMessage(${msg.id})" title="Supprimer ce message"><i class="fa-solid fa-trash"></i></button>`;
                        }

                        existingDiv.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                                <strong style="color: var(--accent); font-size: 0.85rem;">${msg.pseudo}</strong>
                                <div>
                                    <small style="color: var(--text-muted); font-size: 0.75rem; margin-right: 6px;">${time}</small>
                                    ${deleteBtnHTML}
                                </div>
                            </div>
                            <p style="margin: 0; color: var(--text); font-size: 0.95rem;">${msg.content}</p>
                        `;
                    }

                    chatBox.scrollTop = chatBox.scrollHeight;
                }

                window.deleteMessage = async (id) => {
                    if (confirm("Voulez-vous vraiment supprimer ce message ?")) {
                        const { error } = await db.from('messages').update({ is_deleted: true }).eq('id', id);
                        if (error) alert("Erreur de suppression : " + error.message);
                    }
                };

                // Charger l'historique
                const { data: messages, error: selectError } = await db
                    .from('messages')
                    .select('*')
                    .order('created_at', { ascending: true })
                    .limit(50);

                if (!selectError && messages && messages.length > 0) {
                    messages.forEach(msg => renderMessage(msg));
                }

                // Temps réel
                db.channel('public:messages')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
                        if (payload.new) renderMessage(payload.new);
                    })
                    .subscribe();

                // Soumission
                chatForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const text = chatInput.value.trim();
                    if (!text) return;

                    let pseudoFinal = 'Animateur Radio 6 🎙️';

                    if (!isAdmin) {
                        const prenom = document.getElementById('user-prenom').value.trim();
                        const nom = document.getElementById('user-nom').value.trim();
                        const classe = document.getElementById('user-classe').value.trim();

                        if (!prenom || !nom || !classe) {
                            alert("Merci de remplir tous les champs d'identité.");
                            return;
                        }

                        localStorage.setItem('chat_prenom', prenom);
                        localStorage.setItem('chat_nom', nom);
                        localStorage.setItem('chat_classe', classe);

                        pseudoFinal = `${prenom} ${nom} (${classe})`;
                    }

                    const { error } = await db
                        .from('messages')
                        .insert([{ content: text, pseudo: pseudoFinal, is_deleted: false }]);

                    if (error) {
                        alert("Erreur d'envoi : " + error.message);
                    } else {
                        chatInput.value = '';
                    }
                });
            }
        });
    </script>
</body>
</html>
