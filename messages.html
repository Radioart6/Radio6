<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat & Messages - Radio 6</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="LogoArt6automne.png" alt="Logo Radio 6" class="header-logo">
            <div>
                <span class="site-title">RADIO 6</span>
            </div>
        </div>
        <nav id="main-nav">
            <button class="burger-btn" id="burger-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="nav-links-container" id="nav-links">
                <a href="index.html">Accueil</a>
                <a href="calendrier.html">Calendrier</a>
                <a href="messages.html" class="active">Chat</a>
                <a href="equipe.html">L'Équipe</a>
                <a href="rejoindre.html">Rejoindre l'équipe</a>
                <a href="aide.html">Aide</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- MESSAGE POUR LES VISITEURS NON CONNECTÉS -->
        <div id="access-blocked" class="admin-card" style="text-align: center; padding: 3rem 1.5rem; margin-top: 2rem;">
            <i class="fa-solid fa-clock" style="font-size: 3rem; color: var(--accent); margin-bottom: 1rem;"></i>
            <h2>Espace Chat & Messages</h2>
            <p style="font-size: 1.2rem; font-weight: bold; color: var(--text); margin-top: 1rem;">
                Cette page sera disponible le jeudi 1er octobre à 12h45.
            </p>
        </div>

        <!-- CONTENU DU CHAT (VISIBLE UNIQUEMENT SI CONNECTÉ) -->
        <div id="access-granted" class="hidden">
            <div class="admin-card">
                <h2><i class="fa-solid fa-comments"></i> Espace Chat en Direct</h2>
                <p>Bienvenue dans l'espace de discussion de la station.</p>
                <hr style="border-color: rgba(255,255,255,0.1); margin: 1.5rem 0;">
                
                <div id="chat-box" style="height: 300px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.1);">
                    <p style="color: var(--text-muted); text-align: center;">Début de la conversation...</p>
                </div>

                <form id="chat-form" style="display: flex; gap: 10px;">
                    <input type="text" id="chat-input" placeholder="Écrivez votre message..." style="flex: 1; padding: 0.8rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: var(--bg-color); color: var(--text);" required>
                    <button type="submit" class="btn-admin-action" style="align-self: center;">Envoyer</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; Radio 6 - La Radio d'Art 6</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script>
        // Vérification de la connexion de l'administrateur
        document.addEventListener('DOMContentLoaded', () => {
            const isAdmin = sessionStorage.getItem('adminMode') === 'true';
            const blockedDiv = document.getElementById('access-blocked');
            const grantedDiv = document.getElementById('access-granted');

            if (isAdmin) {
                if (blockedDiv) blockedDiv.classList.add('hidden');
                if (grantedDiv) grantedDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
